<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Platform with Comments</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#333;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

textarea{
    height:120px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.post{
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:5px;
    background:#fafafa;
}

.post h2{
    margin:0;
    color:#222;
}

.comments{
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Blog Platform with Comments</h1>

    <input type="text" id="title" placeholder="Enter Blog Title">

    <textarea id="content" placeholder="Write your blog here..."></textarea>

    <button onclick="addPost()">Publish Post</button>

    <div id="posts"></div>
</div>

<script>
function addPost() {

    let title = document.getElementById("title").value;
    let content = document.getElementById("content").value;

    if(title === "" || content === ""){
        alert("Please fill all fields");
        return;
    }

    let post = document.createElement("div");
    post.className = "post";

    post.innerHTML = `
        <h2>${title}</h2>
        <p>${content}</p>

        <input type="text" class="commentInput"
        placeholder="Write a comment">

        <button onclick="addComment(this)">
        Add Comment
        </button>

        <ul class="comments"></ul>
    `;

    document.getElementById("posts").appendChild(post);

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
}

function addComment(button){

    let commentInput =
    button.previousElementSibling;

    let commentText =
    commentInput.value;

    if(commentText === ""){
        alert("Enter a comment");
        return;
    }

    let li = document.createElement("li");
    li.textContent = commentText;

    button.nextElementSibling.appendChild(li);

    commentInput.value = "";
}
</script>

</body>
</html>
